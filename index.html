:root { --bg: #0a0a0b; --surf: #0f0f11; --surf2: #151518; --line: #232327; --line2: #2f2f34; --text: #ededef; --sub: #a1a1aa; --muted: #6b6b74; --acc: #3ecf8e;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; color-scheme: dark; }
:root[data-theme="light"] { --bg: #fafafa; --surf: #fff; --surf2: #f4f4f5; --line: #e4e4e7; --line2: #d4d4d8; --text: #0a0a0b; --sub: #52525b; --muted: #8b8b94; --acc: #0f9d63; color-scheme: light; }
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { font: 15px/1.6 var(--sans); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; } button { font: inherit; color: inherit; }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.13em; flex: none; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 4px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 9px; font-weight: 500; font-size: 14px; border: 1px solid var(--line2); background: var(--surf); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surf2); } .btn.pri { background: var(--text); color: var(--bg); border-color: var(--text); } .btn.pri:hover { opacity: .88; }
.sq { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line2); display: inline-grid; place-items: center; color: var(--sub); background: none; cursor: pointer; }
.sq:hover { color: var(--text); border-color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 8px; font: 12.5px var(--mono); color: var(--sub); border: 1px solid var(--line2); border-radius: 999px; padding: 5px 12px 5px 10px; background: var(--surf); align-self: flex-start; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; } .tag { font: 11.5px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--surf2); color: var(--sub); border: 1px solid var(--line); }
.live { color: var(--acc); } .soonc { color: var(--muted); }

.layout { width: min(1160px, 100% - 32px); margin: 0 auto; display: grid; grid-template-columns: 370px 1fr; gap: 64px; }
aside { position: sticky; top: 0; height: 100vh; padding: 60px 0 36px; display: flex; flex-direction: column; gap: 20px; }
aside h1 { font-size: 38px; font-weight: 600; letter-spacing: -.04em; line-height: 1.05; }
.role { font-size: 17px; margin-top: 6px; } .role .city { color: var(--acc); }
aside > p { color: var(--sub); max-width: 34ch; }
.toc { display: flex; flex-direction: column; margin-top: 6px; }
.toc a { display: flex; align-items: center; gap: 12px; padding: 7px 0; font: 12.5px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.toc a::before { content: ""; width: 28px; height: 1px; background: var(--line2); transition: width .25s, background .25s; }
.toc a.on, .toc a:hover { color: var(--text); } .toc a.on::before, .toc a:hover::before { width: 56px; background: var(--text); }
.social { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; align-items: center; }
.cvreq { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--sub); border: 1px dashed var(--line2); border-radius: 10px; padding: 9px 12px; }
.cvreq b { color: var(--text); font-weight: 500; } .cvreq:hover { border-color: var(--acc); }

main { padding: 60px 0 56px; min-width: 0; }
section { padding-bottom: 56px; scroll-margin-top: 24px; }
.sh { font: 12.5px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 16px; display: flex; justify-content: space-between; gap: 10px; }
.about p { color: var(--sub); font-size: 16px; margin-bottom: 14px; max-width: 62ch; } .about p b { color: var(--text); font-weight: 500; }
.facts { border-top: 1px solid var(--line); margin-top: 6px; }
.facts div { display: grid; grid-template-columns: 130px 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.facts dt { font: 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; } .facts dd { color: var(--sub); }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 22px; }
.nums div { padding: 14px 16px; border-right: 1px solid var(--line); } .nums div:last-child { border: 0; }
.nums b { display: block; font-size: 24px; font-weight: 600; letter-spacing: -.04em; font-variant-numeric: tabular-nums; } .nums span { color: var(--sub); font-size: 12.5px; }

.acc { border-top: 1px solid var(--line); }
.acc details { border-bottom: 1px solid var(--line); }
.acc summary { list-style: none; display: grid; grid-template-columns: 1fr auto 18px; gap: 14px; align-items: center; padding: 14px 4px; cursor: pointer; }
.acc summary::-webkit-details-marker { display: none; }
.acc h4 { font-size: 16px; font-weight: 600; } .acc small { display: block; color: var(--muted); font: 12px var(--mono); margin-top: 1px; }
.acc .s { font: 12px var(--mono); white-space: nowrap; }
.acc .ch { color: var(--muted); transition: transform .2s; } .acc details[open] .ch { transform: rotate(45deg); }
.acc summary:hover h4 { color: var(--acc); }
.acc .in { display: grid; grid-template-columns: 220px 1fr; gap: 18px; padding: 2px 4px 18px; }
.acc .in p { color: var(--sub); font-size: 14.5px; margin-bottom: 10px; }
.acc .in .btn { height: 34px; margin-top: 12px; }
.cover { aspect-ratio: 640/385; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); background: var(--surf2); }
.cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.p-soon .cover img { filter: grayscale(1) opacity(.5); }
.more { margin-top: 16px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 18px 0 6px; }
.tools .f { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100%; } .tools .f::-webkit-scrollbar { display: none; }
.tools .f button { flex: none; font: 500 13px var(--sans); height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--sub); cursor: pointer; }
.tools .f button.on { background: var(--surf2); color: var(--text); border-color: var(--line2); }
.tools label { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.tools input { background: none; border: 0; outline: 0; color: var(--text); font: 13px var(--sans); width: 170px; }
.empty { color: var(--muted); padding: 16px 4px; }
[hidden] { display: none !important; }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.skills div { padding: 12px 0; border-bottom: 1px solid var(--line); }
.skills h4 { font-size: 14.5px; display: flex; gap: 8px; align-items: center; font-weight: 600; } .skills h4 .ic { color: var(--acc); }
.skills p { font: 12px var(--mono); color: var(--muted); margin-top: 2px; }
.setup { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
.certs > div { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.certs b { font-weight: 600; } .certs small { display: block; font: 12px var(--mono); color: var(--muted); margin-top: 2px; }
.certs a { flex: none; display: inline-flex; align-items: center; gap: 4px; font: 12.5px var(--mono); color: var(--sub); } .certs a:hover { color: var(--acc); }
.setup img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); display: block; }
.setup p { color: var(--sub); font-size: 14.5px; margin-bottom: 12px; }
.steps div { display: grid; grid-template-columns: 36px 140px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.steps i { font: 12px var(--mono); color: var(--acc); font-style: normal; padding-top: 2px; } .steps span { color: var(--sub); }
.end { border: 1px solid var(--line); border-radius: 14px; padding: 26px; background: var(--surf); }
.end h3 { font-size: 22px; letter-spacing: -.03em; font-weight: 600; margin-bottom: 8px; } .end p { color: var(--sub); margin-bottom: 18px; }
.end .note { display: flex; gap: 8px; align-items: center; margin: 18px 0 0; font-size: 13.5px; color: var(--muted); }
footer { font: 12px var(--mono); color: var(--muted); padding-top: 24px; }
/* Переключатель языка: сегменты EN | UA */
.lng { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line2); border-radius: 10px; height: 38px; }
.lng button { min-width: 38px; padding: 0 8px; border: 0; border-radius: 7px; background: none; color: var(--muted); font: 500 12.5px var(--mono); cursor: pointer; }
.lng button:hover { color: var(--text); }
.lng button[aria-pressed="true"] { background: var(--surf2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
.lng.sm { height: 30px; margin-left: auto; flex: none; } .lng.sm button { min-width: 32px; font-size: 11.5px; }
.last { display: flex; align-items: center; gap: 8px; margin-top: 12px; font: 12.5px var(--mono); color: var(--muted); }
.last b { color: var(--text); font-weight: 500; }
.acc .in.nocover { grid-template-columns: 1fr; }
/* Тонкая панель разделов на телефоне: появляется, когда профиль уехал за верх экрана */
.mbar { display: none; }

@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; gap: 0; }

  main { padding: 24px 0 36px; } section { padding-bottom: 38px; }

  .acc summary { padding: 13px 2px; min-height: 52px; }
  .skills { grid-template-columns: 1fr 1fr; gap: 0 14px; } .skills h4 { font-size: 13.5px; } .skills p { font-size: 11px; }
  .mbar { display: flex; align-items: center; position: fixed; top: 0; left: 0; right: 0; z-index: 50; gap: 8px; padding: 8px 12px;
    background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
    transform: translateY(-100%); transition: transform .25s; }
  .mlinks { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; } .mlinks::-webkit-scrollbar { display: none; }
  .mbar.show { transform: none; }

  .mbar a { flex: none; font: 12.5px var(--mono); color: var(--sub); padding: 6px 10px; border-radius: 8px; }
  .mbar a.on { background: var(--surf2); color: var(--text); }
  section { scroll-margin-top: 60px; }
  .steps div { grid-template-columns: 30px 1fr; } .steps span { grid-column: 2; }
  .tools label { margin: 0; width: 100%; } .tools input { width: 100%; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }

        <div><dt data-i18n="about.before"></dt><dd data-i18n="about.beforeText"></dd></div>
        <div><dt data-i18n="about.langs"></dt><dd data-i18n="about.langsText"></dd></div>
        <div><dt data-i18n="about.style"></dt><dd data-i18n="about.styleText"></dd></div>
      </dl>
      <div class="nums" id="nums"></div><p class="last" id="last" hidden></p></section>

    <section id="work"><div class="sh"><span data-i18n="work.pinned"></span><span id="cnt"></span></div>
      <div class="acc" id="pins"></div>
      <div class="more"><button class="btn" type="button" id="more"><svg class="ic"><use href="#i-chevrons-down"/></svg> <span id="moreLbl" data-i18n="cta.more"></span> · <span id="n"></span></button></div>
      <div id="rest" hidden>
        <div class="tools"><div class="f" id="f"></div><label><svg class="ic"><use href="#i-search"/></svg><input type="search" id="q" data-i18n-ph="work.search" autocomplete="off"></label></div>
        <div class="acc" id="list"></div></div></section>

    <section id="skills"><div class="sh"><span data-i18n="skills.title"></span></div><div class="skills" id="sk"></div>
      <div class="sh" style="margin-top:36px"><span data-i18n="certs.title"></span></div><div class="certs" id="certs"></div></section>

    <section id="setup"><div class="sh"><span data-i18n="setup.title"></span></div>
      <div class="setup"><a class="shot" href="https://github.com/sonoyumi/yumi-rice" target="_blank" rel="noopener"><img src="assets/img/setup.webp" width="1000" height="625" alt="My Hyprland desktop on Arch Linux" loading="lazy" decoding="async"></a>
        <div><p data-i18n="setup.text"></p><a class="btn" href="https://github.com/sonoyumi/yumi-rice" target="_blank" rel="noopener"><svg class="ic"><use href="#i-github"/></svg> yumi-rice</a></div></div>
      <div class="sh" style="margin-top:36px"><span data-i18n="process.title"></span></div><div class="steps" id="steps"></div></section>

    <section id="contact"><div class="end"><h3 data-i18n="contact.title"></h3><p data-i18n="contact.text"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn pri" data-link="telegram"><svg class="ic"><use href="#i-send"/></svg> <span data-i18n="cta.write"></span></a><a class="btn" data-link="email"><svg class="ic"><use href="#i-mail"/></svg> sonoyumiii@gmail.com</a></div>
      <p class="note"><svg class="ic"><use href="#i-file-text"/></svg><span data-i18n="cv.requestText"></span></p></div>
      <footer>© 2026 Vladyslav Shokun · <span id="clock"></span> <span data-i18n="footer.local"></span></footer></section>
  </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
  const L = SITE.links, ic = (n) => `<svg class="ic"><use href="#i-${n}"/></svg>`;

  // ===== Язык: ?lang= в адресе → сохранённый выбор → язык браузера (uk) → английский =====
  const codes = LANGS.map((l) => l.code);
  let lang = "en";
  try {
    const q = new URLSearchParams(location.search).get("lang"), saved = localStorage.getItem("lang"), nav = navigator.language.slice(0, 2);
    lang = [q, saved, nav].find((x) => codes.includes(x)) || "en";
  } catch (e) {}

  // ===== Данные с GitHub (data/github.js обновляет GitHub Action) =====
  // Публичный репозиторий → «live»; число тестов из README; новые репозитории добавляются сами.
  const GHR = (window.GH && GH.repos) || {};
  const known = new Set(PROJECTS.map((p) => p.slug));
  PROJECTS.forEach((p) => { const g = GHR[p.slug]; if (!g) return; p.status = "live"; if (g.tests) p.tests = g.tests; p.pushed = g.pushed; });
  const catOf = (topics) => ["bots", "backend", "data", "automation", "ai", "linux"].filter((c) =>
    topics.some((x) => ({ bots: /telegram|bot/, backend: /api|fastapi|backend|webhook/, data: /scrap|monitor|data/, automation: /excel|automation|report/, ai: /ai|llm|rag/, linux: /linux|dotfiles|hyprland/ })[c].test(x)));
  Object.entries(GHR).forEach(([slug, g]) => {
    if (known.has(slug)) return;
    PROJECTS.push({ slug, name: slug.replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()), cats: catOf(g.topics).length ? catOf(g.topics) : ["backend"],
      status: "live", tests: g.tests, text: g.description, stack: g.topics.slice(0, 4), pushed: g.pushed, noCover: true });
  });
  // Цифры считаются из данных, чтобы не расходились с GitHub
  const live = PROJECTS.filter((p) => p.status === "live");
  Object.assign(STATS, { live: live.length, soon: PROJECTS.length - live.length, tests: live.reduce((s, p) => s + (p.tests || 0), 0), withTests: live.filter((p) => p.tests).length });

  // ===== Перевод: надписи (I18N) и содержимое (I18N_CONTENT); чего нет — по-английски =====
  const fill = (s) => s.replace(/\{(\w+)\}/g, (m, k) => STATS[k] ?? m);
  const t = (k) => fill((I18N[lang] && I18N[lang][k]) ?? I18N.en[k] ?? k);
  const C = () => (window.I18N_CONTENT && I18N_CONTENT[lang]) || {};
  const ptext = (p) => (C().projects && C().projects[p.slug]) || p.text;
  const catLabel = (c) => (C().cats && C().cats[c.id]) || c.label;
  const skill = (s, i) => { const x = C().skills && C().skills[i]; return x ? { ...s, title: x[0], text: x[1] } : s; };
  const step = (s, i) => { const x = C().process && C().process[i]; return x ? { title: x[0], text: x[1] } : s; };
  // Календарные дни по времени Больцано: вчерашний вечер — «yesterday», а не «today»
  const day = (x) => Date.parse(new Date(x).toLocaleDateString("en-CA", { timeZone: "Europe/Rome" }));
  const ago = (iso) => { const d = Math.max(0, Math.round((day(Date.now()) - day(iso)) / 864e5)); return d === 0 ? t("time.today") : d === 1 ? t("time.yesterday") : t("time.days").replace("{n}", d); };

  const status = (p) => p.status === "live" ? `<span class="live">● ${t("work.live")}</span>` : `<span class="soonc">○ ${t("work.soon")}</span>`;
  const meta = (p) => p.stack.slice(0, 3).join(" · ") + (p.tests ? ` · ${p.tests} ${t("work.tests")}` : "") + (p.noCover ? ` · ${t("work.new")}` : "");
  // Строка проекта; картинка внутри закрытой строки не грузится, пока строку не раскроют
  const item = (p, open) => `<details class="p-${p.status}" data-slug="${p.slug}"${open ? " open" : ""}><summary><div><h4>${p.name}</h4><small>${meta(p)}</small></div><span class="s">${status(p)}</span>${ic("plus").replace('class="ic"', 'class="ic ch"')}</summary>
    <div class="in${p.noCover ? " nocover" : ""}">${p.noCover ? "" : `<div class="cover"><img src="assets/img/${p.slug}.webp" width="640" height="385" alt="${p.name}" loading="lazy" decoding="async"></div>`}
    <div><p>${ptext(p)}</p><div class="tags">${p.stack.map((x) => `<span class="tag">${x}</span>`).join("")}</div>
    ${p.status === "live" ? `<a class="btn" href="https://github.com/sonoyumi/${p.slug}" target="_blank" rel="noopener">${ic("github")} ${t("work.open")}</a>` : ""}</div></div></details>`;
  const openSlugs = (root) => new Set([...root.querySelectorAll("details[open]")].map((d) => d.dataset.slug));

  const pins = PROJECTS.filter((p) => p.featured);
  let cat = "all", built = false, expanded = false, firstPins = true;
  function draw() {
    const q = $("#q").value.toLowerCase(), keep = openSlugs($("#list"));
    const list = PROJECTS.filter((p) => (cat === "all" || p.cats.includes(cat)) && (p.name + ptext(p) + p.text + p.stack.join(" ")).toLowerCase().includes(q));
    $("#list").innerHTML = list.map((p) => item(p, keep.has(p.slug))).join("") || `<p class="empty">${t("work.empty")}</p>`;
  }
  function build() {
    $("#f").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; cat = b.dataset.c; $$("#f button").forEach((x) => x.classList.toggle("on", x === b)); draw(); });
    $("#q").addEventListener("input", draw); built = true;
  }

  // ===== Всё, что зависит от языка; вызывается при загрузке и при переключении =====
  function apply() {
    document.documentElement.lang = lang;
    $$("[data-i18n]").forEach((el) => { el.innerHTML = t(el.dataset.i18n); });
    $$("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    $$("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
    const keep = openSlugs($("#pins"));
    $("#pins").innerHTML = pins.map((p, i) => item(p, firstPins ? i === 0 && innerWidth > 960 : keep.has(p.slug))).join("");
    firstPins = false;
    $("#nums").innerHTML = [[STATS.live, "stats.projects"], [STATS.tests, "stats.tests"], [STATS.soon, "stats.soon"], [STATS.languages, "langs.title"]].map(([n, k]) => `<div><b>${n}</b><span>${t(k)}</span></div>`).join("");
    $("#sk").innerHTML = SKILLS.map((s, i) => { const x = skill(s, i); return `<div><h4>${ic(x.icon)}${x.title}</h4><p>${x.tags.join(" · ")}</p></div>`; }).join("");
    $("#certs").innerHTML = CERTS.map((c) => `<div><div><b>${c.name}</b><small>${c.issuer} · ${new Date(c.date).toLocaleDateString(lang, { month: "short", year: "numeric" })} · ${c.tags.join(" · ")}</small></div>
      ${c.url ? `<a href="${c.url}" target="_blank" rel="noopener">${t("certs.verify")} ${ic("arrow-up-right")}</a>` : ""}</div>`).join("");
    $("#steps").innerHTML = PROCESS.map((s, i) => { const x = step(s, i); return `<div><i>0${i + 1}</i><b>${x.title}</b><span>${x.text}</span></div>`; }).join("");
    if (built) { $("#f").innerHTML = CATEGORIES.map((c) => `<button type="button" data-c="${c.id}" class="${c.id === cat ? "on" : ""}">${catLabel(c)}</button>`).join(""); draw(); }
    $("#moreLbl").textContent = t(expanded ? "cta.less" : "cta.more");
    $("#cnt").textContent = `${expanded ? PROJECTS.length : pins.length} / ${PROJECTS.length}`; $("#n").textContent = PROJECTS.length;
    if (window.GH && GH.lastPush) { const l = $("#last"); l.innerHTML = `<span class="dot"></span>${t("last.push")} <b>${GH.lastPush.repo}</b> · ${ago(GH.lastPush.at)}`; l.hidden = false; }
    $$("[data-lng] button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === lang));
  }

  // Переключатель языка: кнопки в профиле и в мобильной панели, клавиша L; выбор запоминается и попадает в адрес
  $$("[data-lng]").forEach((box) => {
    box.innerHTML = LANGS.map((l) => `<button type="button" data-l="${l.code}">${l.label}</button>`).join("");
    box.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setLang(b.dataset.l); });
  });
  function setLang(l) {
    if (l === lang || !codes.includes(l)) return;
    lang = l; apply();
    try { localStorage.setItem("lang", l); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u);
  }

  $("#more").addEventListener("click", () => {
    if (!built) { build(); }
    expanded = !expanded; $("#rest").hidden = !expanded; $("#pins").hidden = expanded;
    apply();
  });
  addEventListener("keydown", (e) => {
    if (/INPUT/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "p") { $("#more").click(); $("#work").scrollIntoView(); }
    if (e.key === "l") setLang(codes[(codes.indexOf(lang) + 1) % codes.length]);
  });

  // Ссылки, тема, часы
  $$("[data-link]").forEach((a) => { a.href = L[a.dataset.link]; if (!a.href.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener"; } });
  $("#theme").addEventListener("click", () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light"; try { localStorage.setItem("theme", r.dataset.theme); } catch (e) {} });
  const tick = () => $("#clock").textContent = new Date().toLocaleTimeString("it-IT", { timeZone: "Europe/Rome", hour: "2-digit", minute: "2-digit" });
  tick(); setInterval(tick, 30000);
  apply();

  // Отметка раздела в меню — через IntersectionObserver, без обработчика прокрутки
  const links = $$("#toc a, #mbar a");
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-35% 0px -60% 0px" });
  $$("main section[id]").forEach((s) => io.observe(s));
  // Мобильная панель: видна, пока профиль (aside) за верхом экрана
  new IntersectionObserver(([e]) => $("#mbar").classList.toggle("show", !e.isIntersecting)).observe($("#aside"));
});
</script>
</body>
</html>
